name: Export turnkey worktree

on:
  push:
    branches:
      - feature/turnkey-kong-control-plane-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create exact source archive
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_SHA
          git status --short > SOURCE_STATUS
          git archive --format=tar.gz --output=turnkey-worktree.tgz HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turnkey-worktree-${{ github.sha }}
          path: |
            turnkey-worktree.tgz
            SOURCE_SHA
            SOURCE_STATUS
          if-no-files-found: error
          retention-days: 1
